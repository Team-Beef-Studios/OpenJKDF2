// OpenJKDF2 VR - Quest 3 Build Configuration
// Open this folder in Android Studio to build

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.application'

android {
    namespace "com.teambeefvr.jkdf2xr"
    compileSdk 34
    ndkVersion "26.1.10909125"  // Compatible with AGP 8.2

    // Enable native debugging
    packagingOptions {
        doNotStrip "**/*.so"
    }

    defaultConfig {
        applicationId "com.teambeefvr.jkdf2xr"
        minSdk 29  // Quest 2/3 minimum
        targetSdk 34
        // These override AndroidManifest.xml - the Android Gradle Plugin always wins for
        // versionCode/versionName, so editing the manifest alone changes nothing. Keep the
        // two in step, and in step with OPENJKDF2VR_PROJECT_VERSION in cmake_modules.
        versionCode 3
        versionName "0.7.2"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DPLAT_ANDROID_ARM64=TRUE",
                          "-DTARGET_USE_VR=TRUE",
                          "-DTARGET_USE_FFMPEG=TRUE",
                          "-DANDROID_STL=c++_shared",
                          "-DANDROID_PLATFORM=android-29"
                cppFlags "-std=c++17 -fexceptions"
            }
        }
    }

    signingConfigs {
        // Sideload-only: the standard Android debug key, so release APKs install without having
        // to provision a real keystore. Swap this for a proper key before any public release.
        debugKey {
            storeFile file("${System.properties['user.home']}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debugKey
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                    cppFlags "-O2"
                    cFlags "-O2"
                }
            }
        }
        debug {
            debuggable true
            jniDebuggable true
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Debug",
                              "-DANDROID_ARM_MODE=arm",
                              "-DCMAKE_C_FLAGS_DEBUG=-O0 -g -DDEBUG -fno-omit-frame-pointer -fno-limit-debug-info",
                              "-DCMAKE_CXX_FLAGS_DEBUG=-O0 -g -DDEBUG -fno-omit-frame-pointer -fno-limit-debug-info"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"  // Point to root CMakeLists.txt
            version "3.22.1+"
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src/main/java', '../android-project/app/src/main/java']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['assets']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}

// Task to copy game assets to APK
task copyShaders(type: Copy) {
    from '../../resource/shaders'
    into 'assets/shaders'
}

task copySSL(type: Copy) {
    from '../../resource/ssl'
    into 'assets/ssl'
}

task copyUI(type: Copy) {
    from '../../resource/ui'
    into 'assets/ui'
}

// Added: patron credits on exit. SDL_RWFromFile on Android resolves bare
// filenames against assets/, so ship at assets root.
task copyPatrons(type: Copy) {
    from '../../resource/patrons.txt'
    into 'assets'
}

// VR weapon offsets: the PCVR copy is the golden source. Pull it in at build
// time so PCVR and Quest always ship identical, pre-tuned weapon alignment.
task copyWeapons(type: Copy) {
    from '../pcvr/files/jkdf2xr_vr_weapons.json'
    into 'assets'
}

preBuild.dependsOn copyShaders, copySSL, copyUI, copyPatrons, copyWeapons
